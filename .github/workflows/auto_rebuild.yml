name: Auto-rebuild Koam Analytics Web

on:
  schedule:
    # Diario 06:00 UTC (03:00 CLT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # permite disparo manual desde GitHub UI

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo (via deploy key)
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup SSH key for Santiago 2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SANTIAGO2_SSH_KEY }}

      - name: Add Santiago 2 to known_hosts
        run: |
          ssh-keyscan -H 146.181.24.180 >> ~/.ssh/known_hosts

      - name: Run build_web_data.py on Santiago 2 and fetch data
        run: |
          # Ejecuta el rebuild en Santiago 2 (usa python3 del sistema con pandas)
          ssh ubuntu@146.181.24.180 'cd /home/ubuntu/omni && python3 build_web_data.py'
          
          # Trae los data/*.json generados al runner
          mkdir -p data
          scp ubuntu@146.181.24.180:/home/ubuntu/omni/data/stables.json data/stables.json
          scp ubuntu@146.181.24.180:/home/ubuntu/omni/data/history.json data/history.json
          scp ubuntu@146.181.24.180:/home/ubuntu/omni/data/regime.json data/regime.json
          scp ubuntu@146.181.24.180:/home/ubuntu/omni/data/contracts.json data/contracts.json
          scp ubuntu@146.181.24.180:/home/ubuntu/omni/data/track_record.json data/track_record.json

      - name: Commit and push if data changed
        run: |
          git config user.name "koam-bot"
          git config user.email "bot@koam-analytics.io"
          git add data/
          
          # Solo commitea si hay cambios reales
          if git diff --cached --quiet; then
            echo "No data changes — skip commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "auto-rebuild: ${TIMESTAMP}"
            git push
            echo "Pushed at ${TIMESTAMP}"
          fi
